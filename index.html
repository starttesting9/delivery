<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Delivery</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div id="loginBlock" class="login-screen">

    <div class="login-card">

      <div class="login-logo">
        Delivery
      </div>

      <div id="g_id_onload"
        data-client_id="758097653129-i5cda00k5b73uudvmmalj2jdvk70t5jr.apps.googleusercontent.com"
        data-callback="handleCredentialResponse">
      </div>

      <div class="g_id_signin"></div>

    </div>

  </div>

  <div id="loader" class="hidden">

    <div class="loader-boxes">
  
      <div class="loader-box"></div>
      <div class="loader-box"></div>
      <div class="loader-box"></div>
      <div class="loader-box"></div>
      <div class="loader-box"></div>
  
    </div>
  
  </div>

  <div id="deniedScreen" class="hidden">

    <div class="denied-card">
  
      <div class="denied-title">
        Немає доступу
      </div>
  
      <div class="denied-text">
        Ваш акаунт не має доступу до системи
      </div>
  
    </div>
  
  </div>

  <div id="app" class="hidden">

    <div class="container">

      <div class="topbar">

        <div id="userInfo"></div>
      
      </div>

      <div class="form">

        <input
          type="text"
          id="product"
          placeholder="Продукт"
        >

        <input
          type="datetime-local"
          id="createdAt"
        >

        <input
          type="text"
          id="method"
          placeholder="Тип доставки"
        >

        <input
          type="text"
          id="destination"
          placeholder="Куди"
        >

        <select id="status">

          <option value="">
            Статус
          </option>
        
          <option value="new">
            Нове
          </option>
        
          <option value="done">
            Виконано
          </option>
        
          <option value="lost">
            Втрачено
          </option>
        
        </select>

        <textarea
          id="comment"
          placeholder="Коментар"
        ></textarea>

        <button id="createBtn">
          Створити доставку
        </button>

      </div>

      <div class="shipments-header">

        <div class="shipments-title">
          Список забезпечення
        </div>
      
        <button id="loadBtn">
          Оновити
        </button>
      
      </div>

      <div id="shipmentsLoader" class="hidden">

        <div class="loader-boxes">
      
          <div class="loader-box"></div>
          <div class="loader-box"></div>
          <div class="loader-box"></div>
          <div class="loader-box"></div>
          <div class="loader-box"></div>
      
        </div>
      
      </div>

      <div id="shipments"></div>

    </div>

  </div>

  <button id="scrollTopBtn" class="hidden">
    ˄
  </button>

  <div id="toast"></div>

  <script src="app.js"></script>

</body>
</html>
